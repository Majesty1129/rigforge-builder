<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIGFORGE 디자인 추가 도우미</title><style>body{margin:0;background:#0b0e12;color:#eef2f5;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:840px;margin:0 auto;padding:28px}.card{background:#14191f;border:1px solid #2b323a;border-radius:16px;padding:20px;margin-bottom:14px}h1{margin:0 0 8px}.sub{color:#909aa5;font-size:13px;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}input,select,button{width:100%;box-sizing:border-box;height:42px;border-radius:9px;border:1px solid #343d47;background:#0e1217;color:#eef2f5;padding:0 11px}button{background:#ff5a1f;border:0;font-weight:900;cursor:pointer}.secondary{background:#252c34}.list{margin-top:14px;display:grid;gap:7px}.item{display:grid;grid-template-columns:1fr 110px 80px;gap:8px;align-items:center;padding:9px;border:1px solid #2b323a;border-radius:9px}.muted{color:#87919c;font-size:11px}.ok{color:#84daa2}.warn{color:#ffad90}@media(max-width:650px){.row{grid-template-columns:1fr}.item{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>디자인 추가 도우미</h1><div class="sub">기존 <b>logos.json</b>과 새 PNG를 선택하면 이미지 비율을 자동 계산하여 새 logos.json을 만들어 줍니다. 다운로드한 파일로 기존 logos.json을 교체하고, PNG는 logos 폴더에 복사하세요.</div></div><div class="card"><div class="row"><div><label>① 기존 logos.json</label><input id="jsonFile" type="file" accept="application/json,.json"></div><div><label>② 추가할 PNG 파일(여러 개 가능)</label><input id="pngFiles" type="file" accept="image/png" multiple></div><div><label>기본 카테고리</label><input id="category" value="Other"></div><div><label>&nbsp;</label><button id="build">목록 생성</button></div></div><div id="status" class="sub" style="margin-top:12px"></div><div id="list" class="list"></div><div class="row"><button id="download" disabled>logos.json 다운로드</button><button id="copy" class="secondary" disabled>JSON 복사</button></div></div></div><script>let output=[];const $=id=>document.getElementById(id);const slug=s=>s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('logo-'+Date.now());function dimensions(file){return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{resolve([img.naturalWidth,img.naturalHeight]);URL.revokeObjectURL(u)};img.onerror=reject;img.src=u})}$('build').onclick=async()=>{let base=[];const jf=$('jsonFile').files[0];if(jf){try{base=JSON.parse(await jf.text())}catch(e){alert('logos.json 형식이 올바르지 않습니다.');return}}const files=[...$('pngFiles').files];if(!files.length){alert('추가할 PNG 파일을 선택하세요.');return}const category=$('category').value.trim()||'Other';const added=[];for(const f of files){const [w,h]=await dimensions(f),name=f.name.replace(/\.png$/i,'');added.push({id:slug(name),name,file:f.name,ratio:Number((w/h).toFixed(6)),category,tags:[category]})}const map=new Map(base.map(x=>[x.id,x]));added.forEach(x=>map.set(x.id,x));output=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true}));$('status').innerHTML=`<span class="ok">완료:</span> 기존 ${base.length}개 + 추가/갱신 ${added.length}개 = 총 ${output.length}개`;$('list').innerHTML=added.map(x=>`<div class="item"><b>${x.name}</b><span class="muted">${x.ratio}</span><span class="ok">추가</span></div>`).join('');$('download').disabled=$('copy').disabled=false};$('download').onclick=()=>{const b=new Blob([JSON.stringify(output,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='logos.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(output,null,2));$('status').textContent='JSON을 복사했습니다.'}</script></body></html>
