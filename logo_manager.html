<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIGFORGE SVG Logo Manager</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#15191f;--line:#303741;--text:#f5f7fa;--muted:#9ba6b2;--accent:#ff6a00;--danger:#ff4f5e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans KR',sans-serif}header{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;justify-content:space-between;padding:18px 24px;background:rgba(11,13,16,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}h1{font-size:18px;margin:0}header small{color:var(--muted)}main{max-width:1260px;margin:auto;padding:24px}.toolbar,.drop,.status{background:var(--panel);border:1px solid var(--line);border-radius:14px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px;margin-bottom:14px}.toolbar button,.toolbar input,.toolbar select{height:42px;border-radius:9px;border:1px solid var(--line);background:#0e1116;color:var(--text);padding:0 13px}.toolbar button{cursor:pointer;font-weight:700}.toolbar .primary{background:var(--accent);border-color:var(--accent);color:#111}.drop{display:block;padding:24px;text-align:center;border-style:dashed;cursor:pointer;margin-bottom:14px}.drop.drag{border-color:var(--accent);background:#1c1712}.drop b{display:block;margin-bottom:6px}.drop span{color:var(--muted);font-size:13px}.status{padding:12px 15px;color:var(--muted);margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:72px 1fr 34px;gap:10px;align-items:center}.preview{height:66px;border-radius:9px;background:repeating-conic-gradient(#30343a 0 25%,#20242a 0 50%) 50%/16px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img{max-width:92%;max-height:84%;filter:drop-shadow(0 1px 1px #000)}.fields{display:grid;gap:7px}.fields input,.fields select{width:100%;height:34px;border:1px solid var(--line);border-radius:7px;background:#0e1116;color:var(--text);padding:0 9px}.filehint{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:grid;gap:7px}.icon{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;background:#0e1116;color:var(--text);cursor:pointer}.icon.danger{color:var(--danger)}.empty{grid-column:1/-1;padding:50px;text-align:center;color:var(--muted)}.note{margin-top:18px;color:var(--muted);font-size:13px;line-height:1.65}.badge{display:inline-block;background:#20252c;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;color:var(--muted)}@media(max-width:650px){header{align-items:flex-start;padding:15px}main{padding:14px}.grid{grid-template-columns:1fr}.toolbar{gap:7px}.toolbar>*{flex:1 1 auto}}
</style></head><body>
<header><div><h1>RIGFORGE SVG Logo Manager</h1><small>표시 이름을 바꾸면 내보낼 SVG 파일명도 함께 변경됩니다.</small></div><span class="badge" id="count">0 logos</span></header>
<main>
<div class="toolbar"><button id="loadCurrent">현재 logos.json 불러오기</button><button id="sortName">이름순 정렬</button><input id="search" placeholder="로고 검색"><button id="clear">전체 비우기</button><button class="primary" id="export">SVG + logos.json ZIP 내보내기</button></div>
<label class="drop" id="drop" for="files"><b>SVG 파일을 끌어놓거나 클릭하세요</b><span>자산 44.svg처럼 이름이 정리되지 않은 파일도 괜찮습니다. 여러 개를 한꺼번에 선택할 수 있습니다.</span></label><input id="files" type="file" accept="image/svg+xml,.svg" multiple hidden>
<div class="status" id="status">패키지에 포함된 현재 로고를 불러오려면 ‘현재 logos.json 불러오기’를 누르세요.</div><div class="grid" id="grid"></div>
<div class="note"><b>GitHub 반영:</b> 내보낸 ZIP을 풀고, 그 안의 <code>logos</code> 폴더와 <code>logos.json</code>을 저장소에 덮어쓰면 됩니다. 브라우저 보안상 GitHub 파일을 직접 바꾸지는 않습니다.</div>
</main><script src="jszip.min.js"></script><script>
let items=[];const $=id=>document.getElementById(id);const categories=['','Racing','Brake','Electronics','Suspension','Wheel','Tire','Oil','Game','Motorsport','Sim Hardware','Motion'];
function slug(s){return String(s||'logo').normalize('NFKD').toLowerCase().replace(/[^a-z0-9가-힣]+/g,'-').replace(/^-+|-+$/g,'')||'logo'}
function uniqueFile(name,idx){let base=slug(name),file=base+'.svg',n=2;const used=new Set(items.filter((_,i)=>i!==idx).map(x=>x.outFile));while(used.has(file))file=base+'-'+n+++'.svg';return file}
function parseSvg(text){const doc=new DOMParser().parseFromString(text,'image/svg+xml'),svg=doc.documentElement;let vb=(svg.getAttribute('viewBox')||'').trim().split(/[ ,]+/).map(Number);let w=vb.length===4?vb[2]:parseFloat(svg.getAttribute('width'))||1,h=vb.length===4?vb[3]:parseFloat(svg.getAttribute('height'))||1;return {ratio:h?w/h:1}}
async function fileItem(file,name,category=''){const text=await file.text(),meta=parseSvg(text);return{name:name||file.name.replace(/\.svg$/i,''),category,sourceName:file.name,text,ratio:meta.ratio,preview:URL.createObjectURL(new Blob([text],{type:'image/svg+xml'})),outFile:''}}
async function addFiles(list){const svgs=[...list].filter(f=>/\.svg$/i.test(f.name)||f.type==='image/svg+xml');for(const f of svgs)items.push(await fileItem(f));syncFiles();render();$('status').textContent=`SVG ${svgs.length}개를 추가했습니다. 미리보기를 보며 이름을 입력하세요.`}
function syncFiles(){items.forEach((x,i)=>x.outFile=uniqueFile(x.name,i))}
function render(){syncFiles();const q=$('search').value.trim().toLowerCase(),grid=$('grid');grid.innerHTML='';let shown=0;items.forEach((x,i)=>{if(q&&!`${x.name} ${x.sourceName} ${x.category}`.toLowerCase().includes(q))return;shown++;const card=document.createElement('div');card.className='card';card.draggable=true;card.dataset.index=i;const opts=categories.map(c=>`<option ${c===x.category?'selected':''}>${c}</option>`).join('');card.innerHTML=`<div class="preview"><img src="${x.preview}" alt=""></div><div class="fields"><input class="name" value="${esc(x.name)}" placeholder="표시 이름"><select class="cat">${opts}</select><div class="filehint">${esc(x.sourceName)} → <b>${esc(x.outFile)}</b></div></div><div class="actions"><button class="icon up" title="위로">↑</button><button class="icon down" title="아래로">↓</button><button class="icon danger del" title="삭제">×</button></div>`;card.querySelector('.name').oninput=e=>{x.name=e.target.value;syncFiles();render()};card.querySelector('.cat').onchange=e=>x.category=e.target.value;card.querySelector('.del').onclick=()=>{URL.revokeObjectURL(x.preview);items.splice(i,1);render()};card.querySelector('.up').onclick=()=>move(i,i-1);card.querySelector('.down').onclick=()=>move(i,i+1);card.ondragstart=e=>e.dataTransfer.setData('text/plain',i);card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();move(+e.dataTransfer.getData('text/plain'),i)};grid.appendChild(card)});if(!shown)grid.innerHTML='<div class="empty">표시할 로고가 없습니다.</div>';$('count').textContent=`${items.length} logos`}
function move(a,b){if(b<0||b>=items.length||a===b)return;const [x]=items.splice(a,1);items.splice(b,0,x);render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadCurrent(){try{const res=await fetch('logos.json',{cache:'no-store'});if(!res.ok)throw Error();const data=await res.json();items=[];for(const row of data){const r=await fetch('logos/'+encodeURIComponent(row.file).replace(/%2F/g,'/'));const text=await r.text();const blob=new Blob([text],{type:'image/svg+xml'});const f=new File([blob],row.file,{type:'image/svg+xml'});items.push(await fileItem(f,row.name,row.category||''))}render();$('status').textContent=`현재 SVG 로고 ${items.length}개를 불러왔습니다.`}catch(e){$('status').textContent='현재 파일을 불러오지 못했습니다. GitHub Pages에서 열거나 SVG를 직접 업로드하세요.'}}
async function exportZip(){if(!items.length){$('status').textContent='내보낼 로고가 없습니다.';return}syncFiles();const zip=new JSZip(),folder=zip.folder('logos'),json=[];items.forEach((x,i)=>{folder.file(x.outFile,x.text);json.push({id:slug(x.name),name:x.name.trim()||x.outFile.replace(/\.svg$/,''),file:x.outFile,ratio:+x.ratio.toFixed(9),productionHeightAt220:+(220/x.ratio).toFixed(1),...(x.category?{category:x.category,tags:[x.category]}:{})})});zip.file('logos.json',JSON.stringify(json,null,2)+'\n');zip.file('업로드_방법.txt','ZIP을 풀고 logos 폴더와 logos.json을 GitHub 저장소에 덮어쓰세요.\r\n');const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RIGFORGE_SVG_Logos_Export.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent=`${items.length}개 SVG와 logos.json을 ZIP으로 내보냈습니다.`}
$('files').onchange=e=>addFiles(e.target.files);['dragenter','dragover'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('drag')}));['dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('drag')}));$('drop').ondrop=e=>addFiles(e.dataTransfer.files);$('loadCurrent').onclick=loadCurrent;$('sortName').onclick=()=>{items.sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true}));render()};$('search').oninput=render;$('clear').onclick=()=>{items.forEach(x=>URL.revokeObjectURL(x.preview));items=[];render()};$('export').onclick=exportZip;render();loadCurrent();
</script></body></html>
